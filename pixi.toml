# A self-contained ROS 2 Jazzy + Python 3.12 environment (RoboStack), which works on
# any Linux including Ubuntu 22.04. Python 3.12 is what lets the BAM actuator model
# load, so this is the most faithful way to run the sim.
#
#   pixi install && pixi run fetch && pixi run build
#   pixi run sim                  # walk on the flat floor (velstand + all skills)
#   pixi run sim scene:=ball      # with a ball to kick
#   pixi run nav                  # Nav2 in the apartment (pixi run nav mode:=slam to map it)
#   pixi run keyboard             # second terminal
[workspace]
name = "microduck_ros2"
channels = ["https://conda.anaconda.org/robostack-jazzy", "https://conda.anaconda.org/conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-joy = "*"
ros-jazzy-teleop-twist-joy = "*"
ros-jazzy-teleop-twist-keyboard = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-visualization-msgs = "*"
ros-jazzy-std-srvs = "*"
ros-jazzy-tf2-ros-py = "*"
ros-jazzy-launch-ros = "*"
ros-jazzy-navigation2 = "*"
ros-jazzy-nav2-map-server = "*"
ros-jazzy-slam-toolbox = "*"
colcon-common-extensions = "*"
setuptools = "<80"
mujoco = "*"
onnxruntime = "*"
pytest = "*"
onnx = "*"
huggingface_hub = "*"
pip = "*"

[pypi-dependencies]
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", rev = "62bd8ce12154340be97e06f7f41a0ca8f116d967" }
numpy-stl = "*"

[tasks]
fetch = "bash scripts/fetch_microduck_assets.sh"
build = { cmd = "mkdir -p .ws/src && touch .ws/COLCON_IGNORE && ln -sfn $PIXI_PROJECT_ROOT .ws/src/microduck_ros2 && cd .ws && colcon build --symlink-install --base-paths src" }
test = "PYTHONPATH=microduck_policy:microduck_sim python -m pytest -q microduck_policy/test microduck_sim/test"
test-integration = { cmd = "bash -c 'source .ws/install/setup.bash && python -m pytest -q -s microduck_bringup/test'", depends-on = ["build"] }
sim = { cmd = "bash -c 'source .ws/install/setup.bash && ros2 launch microduck_bringup sim.launch.py \"$@\"' --" }
nav = { cmd = "bash -c 'source .ws/install/setup.bash && ros2 launch microduck_bringup nav.launch.py \"$@\"' --" }
map = { cmd = "bash -c 'source .ws/install/setup.bash && ros2 run microduck_sim make_map \"$@\"' --" }
keyboard = { cmd = "bash -c 'source .ws/install/setup.bash && ros2 run teleop_twist_keyboard teleop_twist_keyboard'" }
